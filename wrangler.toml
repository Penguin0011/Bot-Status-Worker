# Worker name updated to bot-status
name = "bot-status"
main = "worker.js"
compatibility_date = "2025-09-15"

[durable_objects]
bindings = [
  { name = "UPTIME_STORAGE", class_name = "UptimeStorage" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UptimeStorage"]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
